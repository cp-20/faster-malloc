name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Build
        run: make

      - name: Correctness (basic)
        run: |
          ./test_basic
          for lib in libfastmalloc2.so libjitmalloc.so; do
            echo "--- $lib ---"
            LD_PRELOAD=$PWD/$lib ./test_basic
          done
          # test_basic asserts v2-family semantics (large-cache mapping
          # reuse / realloc pointer stability, ADR 0011/0018) that v1
          # deliberately does not implement, so under v1 it is expected to
          # stop at that check — see the header of test_basic.c. Verify it
          # stops exactly there (any earlier failure exits differently),
          # and run the v1-specific alignment battery in its place.
          echo "--- libfastmalloc.so (v1: expected stop at large-cache check) ---"
          set +e
          out=$(LD_PRELOAD=$PWD/libfastmalloc.so ./test_basic 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] && [ "$out" = "large-cache mapping not reused" ]
          LD_PRELOAD=$PWD/libfastmalloc.so ./bench/v1align

      - name: Correctness (randomised stress, multithreaded)
        run: |
          for lib in libfastmalloc.so libfastmalloc2.so libjitmalloc.so; do
            echo "--- $lib ---"
            LD_PRELOAD=$PWD/$lib ./bench/stress
          done

      - name: Correctness (valgrind memcheck)
        run: |
          for lib in libfastmalloc2.so libjitmalloc.so; do
            echo "--- $lib ---"
            LD_PRELOAD=$PWD/$lib valgrind --error-exitcode=9 --quiet ./bench/stress
          done

      - name: Instruction counts
        run: |
          # glibc and the two of ours are enough to catch a regression; the
          # competing allocators are not installed on the runner.
          for lib in "" libfastmalloc2.so libjitmalloc.so; do
            if [ -z "$lib" ]; then
              valgrind --tool=callgrind --callgrind-out-file=cg.out --quiet \
                ./bench/instr churn 100000 >/dev/null 2>&1
            else
              LD_PRELOAD=$PWD/$lib valgrind --tool=callgrind \
                --callgrind-out-file=cg.out --quiet \
                ./bench/instr churn 100000 >/dev/null 2>&1
            fi
            printf "%-20s %s instructions\n" "${lib:-glibc}" \
              "$(grep '^summary:' cg.out | awk '{print $2}')"
          done
