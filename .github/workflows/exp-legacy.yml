name: exp-legacy

# Re-baseline the dashboard's older application matrix (rounds 3-6):
# redis, sqlite speedtest1, legacy jq, Lua, CPython, Node, gcc and git.
# Runs all allocators interleaved via bench/apps/apps.sh, with time and
# peak RSS, on current main.  Separate from exp-matrix because it needs
# redis/lua/node and builds its own fixtures.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Repetitions"
        required: false
        default: "3"
      apps:
        description: "Space-separated apps (empty = all)"
        required: false
        default: ""
      allocators:
        description: "Space-separated allocators"
        required: false
        default: "glibc v2 jemalloc mimalloc tcmalloc"
      diag_sizes:
        description: "1 = also dump allocation size histograms for sqlite/gcc/git"
        required: false
        default: "0"
      runtime_env:
        description: "Extra env inherited by every app (NAME=value ...)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: exp-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install runtimes and competing allocators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl unzip git jq python3 \
            redis-server redis-tools lua5.4 nodejs libjemalloc2
          sudo apt-get install -y libmimalloc3 || sudo apt-get install -y libmimalloc2.0
          sudo apt-get install -y libtcmalloc-minimal4t64 || sudo apt-get install -y libtcmalloc-minimal4

      - name: Build Redis with the libc allocator
        run: |
          git clone --depth 1 --branch 8.0.5 https://github.com/redis/redis.git /tmp/redis
          make -C /tmp/redis -j"$(nproc)" MALLOC=libc
          /tmp/redis/src/redis-server --version
          echo "REDIS_BIN=/tmp/redis/src/redis-server" >> "$GITHUB_ENV"
          echo "REDIS_BENCH=/tmp/redis/src/redis-benchmark" >> "$GITHUB_ENV"
          echo "REDIS_CLI=/tmp/redis/src/redis-cli" >> "$GITHUB_ENV"

      - name: Restore legacy fixtures
        uses: actions/cache@v4
        with:
          path: bench/apps/work
          key: legacy-fixtures-v1

      - name: Build fixtures
        run: bash bench/apps/prep.sh

      - name: Diagnose allocation sizes
        if: ${{ inputs.diag_sizes == '1' }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" libfastmallocdiag.so
          DIAG="$PWD/libfastmallocdiag.so"
          WORK="$PWD/bench/apps/work"
          rm -f /tmp/fm-diag-*.log
          ( cd "$WORK" && LD_PRELOAD="$DIAG" ./speedtest1 st.db --size 30 >/dev/null 2>&1 || true )
          ( LD_PRELOAD="$DIAG" gcc -O1 -I"$WORK/sqlite-amalgamation-3450100" -c "$WORK/sqlite-amalgamation-3450100/sqlite3.c" -o /tmp/diag-sqlite3.o >/dev/null 2>&1 || true )
          rm -rf /tmp/gitdiag && cp -r "$WORK/gitfix" /tmp/gitdiag
          ( cd /tmp/gitdiag && LD_PRELOAD="$DIAG" git rev-list --objects --all >/dev/null 2>&1 || true )
          {
            echo "## allocation size histogram (bytes count)"
            for f in /tmp/fm-diag-*.log; do echo "-- $(basename "$f")"; sort -k2 -n "$f"; done
          } | tee diag-sizes.txt
          {
            echo "## diag sizes"
            echo '```'
            cat diag-sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run legacy app matrix
        env:
          REPS: ${{ inputs.reps || '3' }}
          APPS: ${{ inputs.apps || '' }}
          ALLOCATORS: ${{ inputs.allocators || 'glibc v2 jemalloc mimalloc tcmalloc' }}
          RUNTIME_ENV: ${{ inputs.runtime_env || '' }}
        run: |
          set -o pipefail
          if [ -n "$RUNTIME_ENV" ]; then export $RUNTIME_ENV; fi
          make -j"$(nproc)"
          bash bench/apps/apps.sh 2>&1 | tee legacy.txt
          {
            echo "## exp-legacy: ${GITHUB_REF_NAME}"
            echo '```'
            grep -v '^  redis/' legacy.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload legacy matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-legacy-${{ github.run_id }}
          path: |
            legacy.txt
            bench/apps/work/redis-run/log
          if-no-files-found: ignore
