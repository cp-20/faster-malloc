<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>faster-malloc · Benchmark Telemetry</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #111217;
      --panel: #181b1f;
      --panel-hover: #1f2329;
      --border: #2c3235;
      --text: #d8d9da;
      --muted: #8e9299;
      --blue: #5794f2;
      --green: #73bf69;
      --yellow: #fade2a;
      --orange: #ff9830;
      --purple: #b877d9;
      --red: #f2495c;
      --cyan: #56a64b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Grafana-style top navbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .topbar-sub {
      color: var(--muted);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .seg-btn {
      background: #22252b;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 11px;
      font-size: 12px;
      cursor: pointer;
    }
    .seg-btn:hover { color: #fff; border-color: #464c54; }
    .seg-btn.active {
      background: #2e343e;
      color: #fff;
      border-color: var(--blue);
      font-weight: 600;
    }

    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 18px 40px;
    }

    /* Stat row */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px 14px;
    }
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-meta {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #fff;
      line-height: 1.2;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Panels Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .chart-box {
      position: relative;
      height: 230px;
      width: 100%;
    }
    .chart-box.tall {
      height: 310px;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }
    th {
      color: var(--blue);
      font-weight: 600;
      background: #14171c;
    }
    tr:hover td { background: var(--panel-hover); }
    .num {
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .best { color: var(--green); font-weight: 600; }

    .legend-note {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    @media (max-width: 960px) {
      .stat-row, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">faster-malloc</div>
      <div class="topbar-sub" id="top-commit">commit: —</div>
    </div>
    <div class="toolbar">
      <button class="seg-btn active" id="btn-time" onclick="setMetric('time')">Wall Time (s)</button>
      <button class="seg-btn" id="btn-rss" onclick="setMetric('rss')">Peak RSS (MiB)</button>
      <select id="wl-select" class="seg-btn" onchange="onSelectWorkload(this.value)"></select>
    </div>
  </div>

  <div class="wrap">
    <div class="stat-row" id="stat-row"></div>

    <div class="legend-note">
      実線: <code>v2</code> 各オプションの時系列推移 ／ 破線（横棒）: 最新計測における競合アロケータ（<code>glibc</code> / <code>mimalloc</code> / <code>jemalloc</code> / <code>tcmalloc</code>）のベースライン
    </div>

    <!-- Primary Focused Workload + Cachegrind -->
    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">
          <span id="focus-title">Workload Trend</span>
          <span class="panel-meta">lower is better</span>
        </div>
        <div class="chart-box tall"><canvas id="focus-chart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <span>Cachegrind · D1 Misses &amp; Instructions</span>
          <span class="panel-meta">churnmix 50000 / mixed 50000</span>
        </div>
        <div class="chart-box tall"><canvas id="cg-chart"></canvas></div>
      </div>
    </div>

    <!-- All Real-App Workloads Small-Multiples -->
    <div class="grid-2" id="all-workloads-grid"></div>

    <!-- Option Matrix Table -->
    <div class="panel" style="margin-bottom: 12px;">
      <div class="panel-title">
        <span>Latest Commit · Option Matrix &amp; Competitors</span>
        <span class="panel-meta" id="matrix-meta"></span>
      </div>
      <div style="overflow-x:auto;">
        <table id="matrix-table"></table>
      </div>
    </div>

    <!-- Commit Log -->
    <div class="panel">
      <div class="panel-title">
        <span>Commit History</span>
        <span class="panel-meta" id="hist-count"></span>
      </div>
      <div style="overflow-x:auto;">
        <table id="history-table"></table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    Chart.defaults.color = '#8e9299';
    Chart.defaults.borderColor = '#2c3235';
    Chart.defaults.font.family = 'ui-monospace, SFMono-Regular, Menlo, monospace';
    Chart.defaults.font.size = 11;

    const V2_SERIES = [
      { key: 'v2_default',    label: 'v2_default',    color: '#5794f2' },
      { key: 'v2_footprint',  label: 'v2_footprint',  color: '#73bf69' },
      { key: 'v2_shortlived', label: 'v2_shortlived', color: '#56a64b' },
      { key: 'v2_throughput', label: 'v2_throughput', color: '#ff9830' },
      { key: 'v2_locality',   label: 'v2_locality',   color: '#b877d9' }
    ];

    const REF_LINES = [
      { key: 'glibc',    label: 'glibc (ref)',    color: '#94a3b8', dash: [6, 4] },
      { key: 'mimalloc', label: 'mimalloc (ref)', color: '#fade2a', dash: [4, 4] },
      { key: 'jemalloc', label: 'jemalloc (ref)', color: '#f2495c', dash: [2, 3] },
      { key: 'tcmalloc', label: 'tcmalloc (ref)', color: '#e07a5f', dash: [8, 3, 2, 3] }
    ];

    let HISTORY = [];
    let metric = 'time';
    let focusWl = '';
    const charts = {};

    async function load() {
      try {
        const res = await fetch('history.json', { cache: 'no-store' });
        if (res.ok) HISTORY = await res.json();
      } catch (_) {}
      if (!HISTORY.length && Array.isArray(window.BENCH_HISTORY)) {
        HISTORY = window.BENCH_HISTORY;
      }
      init();
    }

    function getAllWorkloads() {
      const set = new Set();
      HISTORY.forEach(h => Object.keys(h.real_suite || {}).forEach(k => set.add(k)));
      return Array.from(set);
    }

    function init() {
      if (!HISTORY.length) return;
      const latest = HISTORY[HISTORY.length - 1];
      document.getElementById('top-commit').textContent =
        `commit: ${latest.commit} · ${latest.timestamp}`;

      const wls = getAllWorkloads();
      const sel = document.getElementById('wl-select');
      sel.innerHTML = '';
      wls.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = w;
        sel.appendChild(opt);
      });
      focusWl = wls[0] || '';
      sel.value = focusWl;

      renderStats(latest);
      renderCachegrind();
      renderAllWorkloads();
      renderFocus();
      renderMatrixTable(latest);
      renderHistoryTable();
    }

    function setMetric(m) {
      metric = m;
      document.getElementById('btn-time').classList.toggle('active', m === 'time');
      document.getElementById('btn-rss').classList.toggle('active', m === 'rss');
      renderFocus();
      renderAllWorkloads();
      renderMatrixTable(HISTORY[HISTORY.length - 1]);
    }

    function onSelectWorkload(wl) {
      focusWl = wl;
      renderFocus();
    }

    function valOf(cell) {
      if (!cell) return null;
      return metric === 'time' ? cell.time_med : +(cell.rss_med_kb / 1024).toFixed(2);
    }

    function buildDatasetsForWorkload(wl) {
      const labels = HISTORY.map(h => h.commit.slice(0, 8));
      const latest = HISTORY[HISTORY.length - 1];
      const datasets = [];

      V2_SERIES.forEach(s => {
        const data = HISTORY.map(h => valOf(((h.real_suite || {})[wl] || {})[s.key]));
        if (data.some(v => v !== null)) {
          datasets.push({
            label: s.label,
            data,
            borderColor: s.color,
            backgroundColor: s.color,
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: 0.15,
            spanGaps: true
          });
        }
      });

      // Horizontal reference lines using the latest commit's competitor values
      REF_LINES.forEach(r => {
        const refVal = valOf(((latest.real_suite || {})[wl] || {})[r.key]);
        if (refVal !== null) {
          datasets.push({
            label: `${r.label}: ${refVal}`,
            data: labels.map(() => refVal),
            borderColor: r.color,
            borderWidth: 1.5,
            borderDash: r.dash,
            pointRadius: 0,
            pointHoverRadius: 0,
            fill: false
          });
        }
      });

      return { labels, datasets };
    }

    function makeLineChart(canvasId, labels, datasets, yLabel) {
      if (charts[canvasId]) charts[canvasId].destroy();
      const ctx = document.getElementById(canvasId).getContext('2d');
      charts[canvasId] = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, padding: 10, color: '#d8d9da' }
            },
            tooltip: {
              backgroundColor: '#1f2329',
              borderColor: '#3a4149',
              borderWidth: 1
            }
          },
          scales: {
            x: { grid: { color: '#22262c' } },
            y: {
              grid: { color: '#22262c' },
              title: { display: true, text: yLabel, color: '#8e9299' }
            }
          }
        }
      });
    }

    function renderFocus() {
      if (!focusWl) return;
      const unit = metric === 'time' ? 'seconds' : 'MiB';
      document.getElementById('focus-title').textContent = `${focusWl} · ${unit}`;
      const { labels, datasets } = buildDatasetsForWorkload(focusWl);
      makeLineChart('focus-chart', labels, datasets, unit);
    }

    function renderCachegrind() {
      const labels = HISTORY.map(h => h.commit.slice(0, 8));
      const datasets = [
        {
          label: 'churnmix D1 misses',
          data: HISTORY.map(h => (((h.cachegrind || {})['churnmix 50000'] || {}).v2_default || {}).d1_misses ?? null),
          borderColor: '#5794f2',
          backgroundColor: '#5794f2',
          borderWidth: 2,
          pointRadius: 3,
          spanGaps: true
        },
        {
          label: 'mixed D1 misses',
          data: HISTORY.map(h => (((h.cachegrind || {})['mixed 50000'] || {}).v2_default || {}).d1_misses ?? null),
          borderColor: '#ff9830',
          backgroundColor: '#ff9830',
          borderWidth: 2,
          pointRadius: 3,
          spanGaps: true
        }
      ];
      makeLineChart('cg-chart', labels, datasets, 'D1 misses');
    }

    function renderAllWorkloads() {
      const wls = getAllWorkloads();
      const grid = document.getElementById('all-workloads-grid');
      grid.innerHTML = '';
      const unit = metric === 'time' ? 's' : 'MiB';

      wls.forEach(wl => {
        const cid = `wl-chart-${wl.replace(/[^a-zA-Z0-9]/g, '_')}`;
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.innerHTML = `
          <div class="panel-title">
            <span>${wl}</span>
            <span class="panel-meta">${unit}</span>
          </div>
          <div class="chart-box"><canvas id="${cid}"></canvas></div>
        `;
        grid.appendChild(panel);
        const { labels, datasets } = buildDatasetsForWorkload(wl);
        makeLineChart(cid, labels, datasets, unit);
      });
    }

    function renderStats(latest) {
      const cm = ((latest.cachegrind || {})['churnmix 50000'] || {}).v2_default || {};
      const mx = ((latest.cachegrind || {})['mixed 50000'] || {}).v2_default || {};
      const rs = latest.real_suite || {};
      let fastWins = 0, rssWins = 0, total = 0;
      Object.values(rs).forEach(w => {
        if (w.v2_default && w.glibc) {
          total++;
          if (w.v2_default.time_med <= w.glibc.time_med) fastWins++;
          if (w.v2_default.rss_med_kb <= w.glibc.rss_med_kb) rssWins++;
        }
      });

      document.getElementById('stat-row').innerHTML = `
        <div class="panel">
          <div class="panel-title"><span>churnmix D1 misses</span></div>
          <div class="stat-val" style="color:var(--green)">${cm.d1_misses ? cm.d1_misses.toLocaleString() : '—'}</div>
          <div class="stat-sub">Ir: ${cm.ir ? cm.ir.toLocaleString() : '—'}</div>
        </div>
        <div class="panel">
          <div class="panel-title"><span>mixed D1 misses</span></div>
          <div class="stat-val" style="color:var(--blue)">${mx.d1_misses ? mx.d1_misses.toLocaleString() : '—'}</div>
          <div class="stat-sub">Ir: ${mx.ir ? mx.ir.toLocaleString() : '—'}</div>
        </div>
        <div class="panel">
          <div class="panel-title"><span>Real-App Speed vs glibc</span></div>
          <div class="stat-val" style="color:var(--yellow)">${fastWins} / ${total}</div>
          <div class="stat-sub">RSS wins: ${rssWins} / ${total}</div>
        </div>
        <div class="panel">
          <div class="panel-title"><span>Tracked Commits</span></div>
          <div class="stat-val">${HISTORY.length}</div>
          <div class="stat-sub">Latest: ${latest.commit}</div>
        </div>
      `;
    }

    function renderMatrixTable(latest) {
      const rs = latest.real_suite || {};
      const wls = Object.keys(rs);
      const cols = [];
      [...V2_SERIES, ...REF_LINES].forEach(s => {
        if (wls.some(w => rs[w][s.key])) cols.push(s.key);
      });
      document.getElementById('matrix-meta').textContent =
        metric === 'time' ? 'Wall Time (s)' : 'Peak RSS (MiB)';

      let html = '<thead><tr><th>Workload</th>' +
        cols.map(c => `<th class="num">${c}</th>`).join('') + '</tr></thead><tbody>';

      wls.forEach(w => {
        const vals = cols.map(c => valOf(rs[w][c]));
        const valid = vals.filter(v => v !== null);
        const minV = valid.length ? Math.min(...valid) : null;
        html += `<tr><td><strong>${w}</strong></td>` + vals.map(v => {
          if (v === null) return '<td class="num">—</td>';
          const cls = v === minV ? 'num best' : 'num';
          return `<td class="${cls}">${metric === 'time' ? v.toFixed(3) : v.toFixed(1)}</td>`;
        }).join('') + '</tr>';
      });
      html += '</tbody>';
      document.getElementById('matrix-table').innerHTML = html;
    }

    function renderHistoryTable() {
      document.getElementById('hist-count').textContent = `${HISTORY.length} runs`;
      let html = '<thead><tr><th>Commit</th><th>Message</th><th>Timestamp</th><th class="num">churnmix Ir</th><th class="num">churnmix D1</th><th class="num">mixed D1</th></tr></thead><tbody>';
      [...HISTORY].reverse().forEach(h => {
        const cm = ((h.cachegrind || {})['churnmix 50000'] || {}).v2_default || {};
        const mx = ((h.cachegrind || {})['mixed 50000'] || {}).v2_default || {};
        html += `<tr>
          <td><code>${h.commit}</code></td>
          <td>${h.message || '—'}</td>
          <td>${h.timestamp}</td>
          <td class="num">${cm.ir ? cm.ir.toLocaleString() : '—'}</td>
          <td class="num">${cm.d1_misses ? cm.d1_misses.toLocaleString() : '—'}</td>
          <td class="num">${mx.d1_misses ? mx.d1_misses.toLocaleString() : '—'}</td>
        </tr>`;
      });
      html += '</tbody>';
      document.getElementById('history-table').innerHTML = html;
    }

    load();
  </script>
</body>
</html>
