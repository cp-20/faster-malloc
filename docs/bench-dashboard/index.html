<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>faster-malloc Benchmark & Trend Dashboard</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111a2e;
      --elevated: #17233b;
      --border: #26354d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --purple: #818cf8;
      --rose: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .container { max-width: 1260px; margin: 0 auto; padding: 32px 24px 72px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 26px;
    }
    h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.12rem; color: #fff; }
    .kpi-val { font-size: 1.65rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .kpi-val.green { color: var(--green); }
    .kpi-val.amber { color: var(--amber); }
    .kpi-label { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .btn {
      background: var(--elevated);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.active { background: var(--accent); color: #0b1120; border-color: var(--accent); font-weight: 700; }

    .bar-row {
      display: grid;
      grid-template-columns: 145px 1fr 90px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .bar-track {
      background: #070c17;
      border-radius: 5px;
      height: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .num { text-align: right; font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: var(--elevated); color: #fff; }
    tr:nth-child(even) td { background: rgba(23, 35, 59, 0.4); }
    .best { color: var(--green); font-weight: 700; }

    @media (max-width: 900px) {
      .grid-4, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>faster-malloc Benchmark &amp; Trend Dashboard</h1>
        <div class="sub">実アプリケーション・オプションマトリクス・Cachegrind 改善トレンド</div>
      </div>
      <div>
        <span class="pill" id="latest-commit">Loading...</span>
      </div>
    </header>

    <div class="grid-4" id="kpi-grid"></div>

    <div class="card">
      <h2>最新コミット: 実アプリ &amp; オプションマトリクス比較</h2>
      <div class="controls">
        <span style="color:var(--muted); font-size:0.84rem;">指標:</span>
        <button class="btn active" id="m-time" onclick="setMetric('time', this)">Wall Time (秒)</button>
        <button class="btn" id="m-rss" onclick="setMetric('rss', this)">Peak RSS (MiB)</button>
      </div>
      <div class="controls" id="workload-btns"></div>
      <div id="matrix-bars"></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>トレンド ①: Cachegrind D1 ミス推移 (`churnmix 50000`)</h2>
        <div id="chart-d1"></div>
      </div>
      <div class="card">
        <h2>トレンド ②: 実アプリ Wall Time / RSS 推移</h2>
        <div class="controls" id="trend-wl-btns"></div>
        <div id="chart-app"></div>
      </div>
    </div>

    <div class="card">
      <h2>コミット別計測履歴</h2>
      <div style="overflow-x:auto;">
        <table id="history-table">
          <thead>
            <tr>
              <th>Commit</th>
              <th>Message</th>
              <th>Timestamp</th>
              <th class="num">churnmix Ir</th>
              <th class="num">churnmix D1 miss</th>
              <th class="num">mixed D1 miss</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const COLORS = {
      v2_default: '#38bdf8',
      v2_footprint: '#34d399',
      v2_shortlived: '#2dd4bf',
      v2_throughput: '#0ea5e9',
      v2_locality: '#a78bfa',
      glibc: '#64748b',
      mimalloc: '#818cf8',
      jemalloc: '#fbbf24',
      tcmalloc: '#fb7185'
    };

    let HISTORY = [];
    let currentMetric = 'time';
    let currentWorkload = '';
    let currentTrendWl = '';

    async function loadData() {
      try {
        const res = await fetch('history.json', { cache: 'no-store' });
        if (res.ok) {
          HISTORY = await res.json();
        }
      } catch (_) {}
      if (!HISTORY.length && Array.isArray(window.BENCH_HISTORY)) {
        HISTORY = window.BENCH_HISTORY;
      }
      init();
    }

    function init() {
      if (!HISTORY.length) return;
      const latest = HISTORY[HISTORY.length - 1];
      document.getElementById('latest-commit').textContent =
        `Latest: ${latest.commit} (${latest.timestamp})`;

      renderKPIs(latest);

      const workloads = Object.keys(latest.real_suite || {});
      if (workloads.length) {
        currentWorkload = workloads[0];
        currentTrendWl = workloads[0];
        const wb = document.getElementById('workload-btns');
        const tb = document.getElementById('trend-wl-btns');
        wb.innerHTML = '';
        tb.innerHTML = '';
        workloads.forEach((wl, i) => {
          const b1 = document.createElement('button');
          b1.className = 'btn' + (i === 0 ? ' active' : '');
          b1.textContent = wl;
          b1.onclick = () => {
            wb.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
            b1.classList.add('active');
            currentWorkload = wl;
            renderMatrixBars();
          };
          wb.appendChild(b1);

          const b2 = document.createElement('button');
          b2.className = 'btn' + (i === 0 ? ' active' : '');
          b2.textContent = wl;
          b2.onclick = () => {
            tb.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
            b2.classList.add('active');
            currentTrendWl = wl;
            renderAppTrend();
          };
          tb.appendChild(b2);
        });
        renderMatrixBars();
        renderAppTrend();
      }

      renderD1Trend();
      renderHistoryTable();
    }

    function renderKPIs(latest) {
      const cg = (latest.cachegrind || {})['churnmix 50000'] || {};
      const v2cg = cg.v2_default || {};
      const rs = latest.real_suite || {};
      let winsVsGlibc = 0, totalWl = 0;
      Object.values(rs).forEach(w => {
        if (w.v2_default && w.glibc) {
          totalWl++;
          if (w.v2_default.time_med <= w.glibc.time_med) winsVsGlibc++;
        }
      });

      const grid = document.getElementById('kpi-grid');
      grid.innerHTML = `
        <div class="card" style="margin:0">
          <div class="kpi-val green">${v2cg.d1_misses ? v2cg.d1_misses.toLocaleString() : '—'}</div>
          <div class="kpi-label">churnmix D1 misses (v2_default)</div>
        </div>
        <div class="card" style="margin:0">
          <div class="kpi-val">${v2cg.ir ? (v2cg.ir / 1e6).toFixed(2) + 'M' : '—'}</div>
          <div class="kpi-label">churnmix Instructions Ir (v2_default)</div>
        </div>
        <div class="card" style="margin:0">
          <div class="kpi-val amber">${winsVsGlibc} / ${totalWl}</div>
          <div class="kpi-label">実アプリ速度勝率 vs glibc</div>
        </div>
        <div class="card" style="margin:0">
          <div class="kpi-val">${HISTORY.length}</div>
          <div class="kpi-label">記録済みコミット数</div>
        </div>
      `;
    }

    function setMetric(m, btn) {
      currentMetric = m;
      document.getElementById('m-time').classList.remove('active');
      document.getElementById('m-rss').classList.remove('active');
      btn.classList.add('active');
      renderMatrixBars();
    }

    function renderMatrixBars() {
      const latest = HISTORY[HISTORY.length - 1];
      const wdata = (latest.real_suite || {})[currentWorkload] || {};
      const entries = Object.entries(wdata).map(([name, m]) => ({
        name,
        val: currentMetric === 'time' ? m.time_med : (m.rss_med_kb / 1024)
      })).sort((a, b) => a.val - b.val);

      const container = document.getElementById('matrix-bars');
      container.innerHTML = '';
      if (!entries.length) return;
      const max = Math.max(...entries.map(e => e.val));
      const min = entries[0].val;

      entries.forEach(e => {
        const pct = max > 0 ? ((e.val / max) * 100).toFixed(1) : 0;
        const unit = currentMetric === 'time' ? 's' : 'MiB';
        const formatted = currentMetric === 'time' ? e.val.toFixed(3) : e.val.toFixed(1);
        const color = COLORS[e.name] || '#94a3b8';
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
          <span>${e.val === min ? '<strong>' + e.name + ' ★</strong>' : e.name}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
          <span class="num">${formatted} ${unit}</span>
        `;
        container.appendChild(row);
      });
    }

    function renderLineChart(elId, seriesList, labels, unit) {
      const el = document.getElementById(elId);
      const allVals = seriesList.flatMap(s => s.values.filter(v => v !== null));
      if (!allVals.length) { el.innerHTML = '<div class="sub">データなし</div>'; return; }
      const W = 520, H = 200, padL = 52, padR = 16, padT = 18, padB = 34;
      const minV = Math.min(...allVals) * 0.9;
      const maxV = Math.max(...allVals) * 1.08 || 1;
      const n = labels.length;

      const xOf = i => padL + (n <= 1 ? (W - padL - padR) / 2 : (i / (n - 1)) * (W - padL - padR));
      const yOf = v => padT + (1 - (v - minV) / (maxV - minV || 1)) * (H - padT - padB);

      let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">`;
      for (let g = 0; g <= 3; g++) {
        const y = padT + (g / 3) * (H - padT - padB);
        const val = maxV - (g / 3) * (maxV - minV);
        svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#26354d" stroke-dasharray="3 3"/>`;
        svg += `<text x="${padL-6}" y="${y+4}" fill="#94a3b8" font-size="10" text-anchor="end">${val >= 1000 ? (val/1000).toFixed(1)+'k' : val.toFixed(2)}</text>`;
      }
      labels.forEach((lb, i) => {
        if (n <= 8 || i === 0 || i === n - 1 || i % Math.ceil(n / 6) === 0) {
          svg += `<text x="${xOf(i)}" y="${H-10}" fill="#94a3b8" font-size="10" text-anchor="middle">${lb}</text>`;
        }
      });
      seriesList.forEach(s => {
        const pts = s.values.map((v, i) => v === null ? null : `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).filter(Boolean);
        if (pts.length >= 2) {
          svg += `<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts.join(' ')}"/>`;
        }
        s.values.forEach((v, i) => {
          if (v !== null) {
            svg += `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="4" fill="${s.color}"><title>${s.name}: ${v} ${unit}</title></circle>`;
          }
        });
      });
      svg += `</svg>`;
      const legend = seriesList.map(s => `<span style="margin-right:12px;font-size:0.78rem;color:${s.color};">● ${s.name}</span>`).join('');
      el.innerHTML = svg + `<div style="margin-top:6px;">${legend}</div>`;
    }

    function renderD1Trend() {
      const labels = HISTORY.map(h => h.commit.slice(0, 8));
      const vals = HISTORY.map(h => (((h.cachegrind || {})['churnmix 50000'] || {}).v2_default || {}).d1_misses ?? null);
      renderLineChart('chart-d1', [{ name: 'v2_default D1 misses', color: '#38bdf8', values: vals }], labels, 'misses');
    }

    function renderAppTrend() {
      const labels = HISTORY.map(h => h.commit.slice(0, 8));
      const keys = ['v2_default', 'v2_footprint', 'glibc', 'mimalloc'];
      const series = keys.map(k => ({
        name: k,
        color: COLORS[k] || '#94a3b8',
        values: HISTORY.map(h => {
          const w = ((h.real_suite || {})[currentTrendWl] || {})[k];
          return w ? w.time_med : null;
        })
      })).filter(s => s.values.some(v => v !== null));
      renderLineChart('chart-app', series, labels, 's');
    }

    function renderHistoryTable() {
      const tbody = document.querySelector('#history-table tbody');
      tbody.innerHTML = '';
      [...HISTORY].reverse().forEach(h => {
        const cm = ((h.cachegrind || {})['churnmix 50000'] || {}).v2_default || {};
        const mx = ((h.cachegrind || {})['mixed 50000'] || {}).v2_default || {};
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><code>${h.commit}</code></td>
          <td>${h.message || '—'}</td>
          <td>${h.timestamp}</td>
          <td class="num">${cm.ir ? cm.ir.toLocaleString() : '—'}</td>
          <td class="num">${cm.d1_misses ? cm.d1_misses.toLocaleString() : '—'}</td>
          <td class="num">${mx.d1_misses ? mx.d1_misses.toLocaleString() : '—'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadData();
  </script>
</body>
</html>
